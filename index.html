<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff0f6" />
  <title>A Little Surprise 💗</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; overflow: hidden; font-family: 'Trebuchet MS', Arial, sans-serif; background: radial-gradient(circle at 25% 20%, #fff 0%, #fff0f6 48%, #ffd9e8 100%); color: #8e315c; }
    main { text-align: center; padding: 2rem; position: relative; z-index: 2; }
    .eyebrow { font-size: .95rem; letter-spacing: .2em; text-transform: uppercase; color: #bb7192; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: .6rem 0 1.7rem; }
    button { border: 0; border-radius: 100px; padding: 1rem 2rem; background: linear-gradient(135deg, #ff5c9b, #ef3283); box-shadow: 0 12px 30px #ed43814d; color: white; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: transform .2s, box-shadow .2s; }
    button:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 16px 36px #ed438166; }
    button:focus-visible { outline: 3px solid #8e315c; outline-offset: 4px; }
    #message { min-height: 5.5rem; margin-top: 1.8rem; font-size: clamp(3.3rem, 12vw, 6rem); font-weight: 800; color: #f72f91; text-shadow: 0 4px 20px #ff7bb06b; opacity: 0; transform: translateY(20px) scale(.85); transition: opacity .7s, transform .7s; }
    #message.show { opacity: 1; transform: translateY(0) scale(1); }
    .hint { margin-top: .5rem; font-size: .9rem; color: #b66e8d; }
    .heart { position: fixed; bottom: -40px; pointer-events: none; z-index: 1; animation: floatUp var(--duration) linear forwards; opacity: 0; }
    @keyframes floatUp { 0% { transform: translate(0, 0) rotate(-15deg) scale(.7); opacity: 0; } 12% { opacity: .9; } 85% { opacity: .8; } 100% { transform: translate(var(--drift), -110vh) rotate(20deg) scale(1.2); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Just for you ✨</div>
    <h1>I have a little surprise...</h1>
    <button id="reveal" type="button">Click here 💌</button>
    <div id="message" role="status" aria-live="polite">I Love 💗</div>
    <p class="hint">Made with love, just for you.</p>
  </main>
  <script>
    const button = document.getElementById('reveal');
    const message = document.getElementById('message');
    function heart() {
      const el = document.createElement('span');
      el.className = 'heart';
      el.textContent = ['💗', '💕', '💖', '❤️', '🌸'][Math.floor(Math.random() * 5)];
      el.style.left = `${Math.random() * 100}vw`;
      el.style.fontSize = `${18 + Math.random() * 28}px`;
      el.style.setProperty('--duration', `${3.5 + Math.random() * 3}s`);
      el.style.setProperty('--drift', `${Math.random() * 180 - 90}px`);
      document.body.appendChild(el);
      el.addEventListener('animationend', () => el.remove(), { once: true });
    }
    button.addEventListener('click', () => {
      message.classList.add('show');
      button.textContent = 'You make me smile 💗';
      for (let i = 0; i < 28; i++) setTimeout(heart, i * 85);
    });
  </script>
</body>
</html>
